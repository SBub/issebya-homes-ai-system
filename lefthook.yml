pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,md,css}"
      run: yarn prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: yarn turbo run lint
    typecheck:
      glob: "*.ts"
      run: yarn turbo run typecheck
    knip:
      glob: "*.{ts,js,json}"
      run: yarn knip
    format-py:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    lint-py:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    typecheck-py:
      glob: "*.py"
      run: uv run mypy {staged_files}

pre-push:
  commands:
    tests:
      run: yarn turbo run test
