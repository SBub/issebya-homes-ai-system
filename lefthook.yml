pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.ts"
      run: npx tsc --noEmit

pre-push:
  commands:
    tests:
      run: npx vitest run
