pre-commit:
  parallel: true
  commands:
    format:
      # `mdx` is here because blog posts under apps/website/src/content/blog
      # are .mdx. Prettier's mdx parser round-trips them without touching the
      # `export const meta = {...}` frontmatter block, so they are formatted
      # like everything else rather than ignored.
      glob: "*.{ts,tsx,js,jsx,json,md,mdx,css}"
      run: yarn prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: yarn turbo run lint
    typecheck:
      glob: "*.ts"
      run: yarn turbo run typecheck
    knip:
      glob: "*.{ts,js,json}"
      run: yarn knip
    py-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    py-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    py-typecheck:
      glob: "*.py"
      run: uv run mypy --explicit-package-bases {staged_files}

pre-push:
  commands:
    tests:
      run: yarn turbo run test
