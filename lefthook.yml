pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,json}"
      run: yarn biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.ts"
      run: yarn turbo run typecheck
    knip:
      glob: "*.{ts,js,json}"
      run: yarn knip

pre-push:
  commands:
    tests:
      run: yarn turbo run test
