[tool.turbo]
name = "issebya-homes-ai-system-py"

[tool.uv]
required-version = ">=0.12"

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
exclude = [
  "apps/guest-communication-agent",
  "apps/telegram-router",
  "apps/website",
  "packages/pricing",
]

[dependency-groups]
dev = ["ruff>=0.16", "mypy>=2.3"]
