name: Supabase Migrations

# Separate from ci.yml on purpose: same convention as eval-golden.yml — a
# distinct concern with its own trigger shape, not folded into the
# lint/typecheck/test job.
#
# Three jobs, three different concerns entirely:
#   - dry-run: PRs into develop OR master that touch supabase/migrations/**.
#     Applies the full migration history to a fresh ephemeral local Postgres
#     (via `supabase start`) — catches broken SQL early, at both the
#     feature->develop stage and the develop->master promotion stage. Needs
#     no secrets, never touches a real hosted project.
#   - push: on push to master when supabase/migrations/** changed, or on a
#     manual dispatch with job=push. Applies pending migrations to the real
#     hosted prod project via `supabase db push`.
#   - drift-check: daily, and on a manual dispatch with job=drift-check.
#     Read-only. Answers the one question nothing else here answers: does
#     prod actually hold the migrations master says it should?
#
# Why drift-check exists at all. The push job runs *after* merge, so a
# failing push blocks nothing — the migration is already in git and the PR
# is already green. Worse, a red X on master is effectively invisible
# because develop is this repo's GitHub default branch, so that is not the
# branch anyone is looking at. The failure mode this creates is silent: a
# migration lands in git, never reaches prod, and local history diverges
# from prod's supabase_migrations.schema_migrations with no signal at all.
# drift-check is the signal. It is deliberately indifferent to *why* the
# two sides disagree — a failed push, a hand-run statement in the SQL
# editor, a repaired history — because the thing worth alerting on is the
# disagreement, not its cause.
#
# Secrets: push and drift-check both need SUPABASE_ACCESS_TOKEN and
# SUPABASE_PROJECT_REF repo secrets. Both exist, and both predate the last
# successful push on 2026-08-28. Since 2026-09-10 every push run has failed
# at `supabase link` with "Authorization failed for the access token and
# project ref pair" — but the obvious reading of that message, a dead
# token, is not what is happening:
#   - the token is valid until 2026-11-25, and its "last used" stamp moved
#     on 2026-09-10, so Supabase accepted it and identified the account;
#   - the failure is a 403 on privileges ("Your account does not have the
#     necessary privileges to access this endpoint"), not a 401 on identity;
#   - `supabase projects list` on that account still returns project
#     gqoeyqvwgmkyxasqknss (issebya-homes-ai-system, org issebya), so the
#     project ref is right and the account's access to it is intact.
# Nothing on our side changed either: this workflow has exactly one commit
# in its history (d266b7e). The cause is still unresolved. The leading
# suspect is the CLI version, see the next paragraph. Until it is found,
# push and drift-check will both fail at the link step — a real outstanding
# problem, not a quirk of these jobs.
#
# CLI version: pinned to 2.116.0 below rather than `latest`. `latest` is an
# unpinned external input, and it is how a green pipeline here broke itself
# without a single commit in this repo. The stable releases either side of
# the break are v2.116.0 (2026-08-26) and v2.117.0 (2026-09-07), so the last
# successful push ran 2.116.0 and the first failure ran 2.117.0. That is
# inferred from release dates, not observed: supabase/setup-cli does not log
# the version it installs. v2.117.0 rewrote the CLI auth layer
# (legacy-platform-api.layer.ts, legacy-credentials.service.ts,
# legacy-platform-api-factory.*, access_token.go) and its notes mention
# ProjectConfig gaining hosted-field configuration, so `link` may now call
# endpoints wanting a higher org role than this account holds. Ruled out:
# the sbp_v0 token-format change in v2.117.0 is purely additive
# (^sbp_(oauth_)?[a-f0-9]{40}$ -> ^sbp_(oauth_|v0_)?[a-f0-9]{40}$), so the
# existing old-format token still matches. The pin therefore does two jobs:
# it makes these runs reproducible, and it is the experiment for this
# specific failure — dispatch job=push with the pin in place and see whether
# the unchanged token goes green on 2.116.0.
#
# One workflow_dispatch serves both jobs rather than two near-identical
# workflows; the `job` input picks which one runs. It defaults to
# drift-check because that is the read-only one — writing to prod is opt-in,
# never something you get by hitting "Run workflow" without reading it.

on:
  pull_request:
    branches: [develop, master]
    paths:
      - "supabase/migrations/**"
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
  schedule:
    # 05:00 UTC daily — off-peak, and early enough that a drift alert is
    # waiting at the start of the working day rather than arriving mid-change.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        default: drift-check
        options:
          - drift-check
          - push

jobs:
  dry-run:
    # PRs only. Deliberately not wired to workflow_dispatch: spinning up a
    # full local stack tells you nothing you want from a manual run, and the
    # PR that introduced the migration already ran it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately, not `latest` — see the CLI version note in
          # the header block. Bump this on purpose, never by drift.
          version: 2.116.0

      - name: Apply migrations to a fresh local Postgres
        run: supabase start

      - name: Stop local stack
        if: always()
        run: supabase stop

  push:
    # The dispatch arm is the retry path: when a push run fails for a
    # reason outside the migrations themselves (a credentials or privileges
    # error, a Supabase outage, a bad CLI release), re-running it should not
    # require fabricating a commit on master just to re-fire the push
    # trigger. It is also how the CLI pin gets tested — see the header.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'push')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned, not left to default. A manual dispatch runs against
          # whatever branch the UI picked, and that box defaults to develop
          # — which would push develop's unpromoted migrations straight to
          # prod. Prod is deployed from master, so master is the only branch
          # whose migrations may be applied to it.
          ref: master

      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately, not `latest` — see the CLI version note in
          # the header block. Bump this on purpose, never by drift.
          version: 2.116.0

      - name: Link to prod project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push pending migrations to prod
        run: supabase db push

  drift-check:
    # schedule + dispatch only. `paths:` filters are ignored by both of
    # those event types, so there is no point trying to scope this to
    # supabase/migrations/** — and scoping would defeat the purpose anyway,
    # since drift can appear without any file in this repo changing.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'drift-check')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Must be master, and this is the whole reason the job needs an
          # explicit ref. GitHub only ever runs `schedule:` from the default
          # branch's copy of this file, and the default branch here is
          # develop. Checking out develop would compare develop's migration
          # files against prod and report drift every single time develop is
          # legitimately ahead of master — which is most of the time. Prod is
          # deployed from master; master is what prod should match.
          ref: master

      - uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately, not `latest` — see the CLI version note in
          # the header block. Bump this on purpose, never by drift.
          version: 2.116.0

      - name: Link to prod project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Compare master's migration history against prod
        run: |
          set -uo pipefail
          # Actions' default shell is `bash -eo pipefail`. Errexit is turned
          # off on purpose: both CLI calls are inspected by hand below, and a
          # non-zero exit from one of them should reach the reporting code
          # rather than killing the step with no explanation.
          set +e

          # Both CLI commands below exit 0 whether or not there is drift, so
          # neither can be used as a bare assertion — the output has to be
          # captured and inspected. The two shapes below were verified by
          # hand against CLI 2.75.0; this job runs the pinned 2.116.0, where
          # they are believed unchanged but were not observed directly.
          #
          # Assumption A (`supabase db push --dry-run`): prints the literal
          # line "Remote database is up to date." when nothing is pending,
          # and "Would push these migrations:" followed by one " • <file>"
          # bullet per migration when something is. We match on those two
          # sentinel phrases.
          #
          # Assumption B (`supabase migration list --linked`): prints a
          # pipe-delimited table with Local | Remote | Time (UTC) columns,
          # blanking the Local cell for a version that exists on prod but
          # has no file in this repo. We treat "column 1 empty, column 2 is
          # a bare number" as a remote-only row, which also skips the header
          # and the ---- separator without needing to match them.
          #
          # If a future CLI version changes either shape, this job goes
          # quiet (A) or noisy (B) rather than erroring, so that is the
          # first thing to check if it ever starts disagreeing with reality.

          drift=0

          echo "::group::supabase db push --dry-run"
          push_out="$(supabase db push --dry-run 2>&1)"
          echo "$push_out"
          echo "::endgroup::"

          if echo "$push_out" | grep -qF "Would push these migrations:"; then
            drift=1
            echo "::error::Migrations exist in master but have NOT been applied to prod:"
            echo "$push_out" | sed -n '/Would push these migrations:/,$p' | grep -F '•' || true
          elif ! echo "$push_out" | grep -qF "Remote database is up to date."; then
            drift=1
            echo "::error::Could not determine push status from the CLI output above. Neither 'Would push these migrations:' nor 'Remote database is up to date.' was present — the CLI output format may have changed."
          fi

          echo "::group::supabase migration list --linked"
          list_out="$(supabase migration list --linked 2>&1)"
          echo "$list_out"
          echo "::endgroup::"

          remote_only="$(
            echo "$list_out" | awk -F'|' 'NF >= 3 {
              local_col = $1; remote_col = $2
              gsub(/[[:space:]]/, "", local_col)
              gsub(/[[:space:]]/, "", remote_col)
              if (local_col == "" && remote_col ~ /^[0-9]+$/) print remote_col
            }'
          )"

          if [ -n "$remote_only" ]; then
            drift=1
            echo "::error::Prod has migration versions with no corresponding file in master. Someone applied or repaired history outside this repo:"
            echo "$remote_only" | sed 's/^/  /'
          fi

          if [ "$drift" -ne 0 ]; then
            echo
            echo "Migration drift detected between master and the prod Supabase project."
            echo "Local history and prod's supabase_migrations.schema_migrations disagree."
            echo "To apply what is missing: re-run this workflow via Run workflow with job=push."
            exit 1
          fi

          echo "No drift: master's migration history matches prod."
