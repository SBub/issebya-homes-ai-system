name: GCA Eval Gate

# Separate from ci.yml on purpose: this runs real Braintrust experiments
# against real model calls (real API spend), on a different trigger/cadence
# than lint/typecheck/test. Only `develop`/`master`, and only when this
# app's own files change (see `paths:` below), to avoid spending real API
# budget on pushes that can't have touched the eval-gated behavior.
#
# The `pull_request` trigger targeting `master` is what actually gates a
# develop -> master promotion: it runs the same two score gates
# (scripts/ci-gate-evals.ts) as a check on the PR itself, before merge, not
# just after. It still isn't a REQUIRED check that blocks the merge button
# — that needs a branch protection rule, which needs a GitHub plan upgrade
# on this private repo (see ENGINEERING.md's "Known limitations" section)
# — but the pass/fail is visible on the PR before anyone approves it.
on:
  push:
    branches: [develop, master]
    paths:
      - "apps/guest-communication-agent/**"
  pull_request:
    branches: [master]
    paths:
      - "apps/guest-communication-agent/**"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 — this app's evals need it (see
          # apps/guest-communication-agent/docs/braintrust-online-eval-testing.md's
          # repeated Node-22 upload-slot note), same version ci.yml already
          # pins.
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run eval gate (golden dataset + prompt injection)
        working-directory: apps/guest-communication-agent
        # No --env-file=.env here — there is no local .env file in the
        # runner. scripts/ci-gate-evals.ts reads these three vars straight
        # off process.env, populated below from repo secrets.
        run: yarn tsx scripts/ci-gate-evals.ts
        env:
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BRAINTRUST_PROJECT_ID: ${{ secrets.BRAINTRUST_PROJECT_ID }}
