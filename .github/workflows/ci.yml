name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Biome check
        run: yarn biome check .

      - name: Type check (tsc)
        run: yarn tsc --noEmit

      - name: Dead code check (knip)
        run: yarn knip

      - name: Tests
        run: yarn vitest run
